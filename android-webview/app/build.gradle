plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// For emulator: -PwebviewBaseUrl=http://10.0.2.2:8765/
// For real deployment: pass an HTTPS URL, e.g. -PwebviewBaseUrl=https://clinic.example.org/
def webviewBaseUrl = (project.findProperty('webviewBaseUrl') ?: 'http://10.0.2.2:8765/').toString()
android {
    namespace 'ru.cliniccompanion.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.cliniccompanion.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
        buildConfigField 'String', 'WEBVIEW_BASE_URL', '"' + webviewBaseUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}

// Firebase setup is intentionally conditional so the source remains inspectable without a private project file.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
